[project]
name = "defi-thesis-risk-copilot-backend"
version = "0.1.0"
description = "FastAPI backend for DeFi Thesis & Risk Copilot."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "postgres_integration: requires RUN_POSTGRES_INTEGRATION=true and a PostgreSQL database",
]

[tool.setuptools.package-data]
"app.llm" = ["research_gpu_ollama_manifest.json"]
