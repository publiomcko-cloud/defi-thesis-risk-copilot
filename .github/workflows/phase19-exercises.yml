name: Phase 19 Failure Exercises

on:
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase19-exercises-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-exercises:
    name: Isolated failure exercises
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: defi_copilot_exercises
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d defi_copilot_exercises"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/defi_copilot_exercises
      APP_ENV: exercise
      OPERATIONS_EXERCISES_ENABLED: "true"
      OPERATIONS_EXERCISES_ISOLATED: "true"
      OPERATIONS_EXERCISE_TIMEOUT_SECONDS: "180"
      VAST_ENABLED: "false"
      VAST_DRY_RUN: "true"
      VAST_REAL_RENTALS_ENABLED: "false"
      RUN_POSTGRES_INTEGRATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Provision isolated pgvector database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d defi_copilot_exercises -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Apply isolated migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run fixed isolated exercise catalog
        working-directory: backend
        run: python -m scripts.run_phase19_exercises --run
