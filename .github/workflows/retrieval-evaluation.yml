name: Public Retrieval Evaluation

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m scripts.evaluate_public_corpus --output /tmp/phase18g-retrieval-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase18g-public-retrieval-evaluation
          path: /tmp/phase18g-retrieval-eval.json
          if-no-files-found: ignore
