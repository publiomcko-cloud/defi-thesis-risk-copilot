name: Temporary Phase 21C Lock Refresh

on:
  push:
    branches:
      - automation/phase21c-lock-refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-target-branch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/v1-phase-21c-quality-feedback-governance
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply patched frontend dependencies
        working-directory: frontend
        run: |
          npm pkg set dependencies.next=15.5.25
          npm pkg set overrides.sharp=0.35.4
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --check
          git commit -m "chore(security): update patched frontend dependencies"
          git push origin HEAD:agent/v1-phase-21c-quality-feedback-governance
