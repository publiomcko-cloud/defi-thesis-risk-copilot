name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: defi_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d defi_copilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/defi_copilot_test
      APP_ENV: test
      PUBLIC_DEMO_MODE: "false"
      AUTH_ENABLED: "false"
      VAST_ENABLED: "false"
      VAST_DRY_RUN: "true"
      RUN_POSTGRES_INTEGRATION: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall app scripts

      - name: Provision pgvector for integration database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d defi_copilot_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Verify pgvector preflight
        run: python -m scripts.preflight_pgvector

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head

      - name: Run tests
        run: set -o pipefail; python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt

      - name: Evaluate public retrieval cutover gate
        run: python -m scripts.evaluate_public_corpus

      - name: Upload backend validation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-validation-log
          path: backend/pytest-output.txt
          if-no-files-found: ignore

      - name: Validate public runtime preparation
        env:
          PUBLIC_DEMO_MODE: "true"
        run: python -m scripts.prepare_runtime 2>&1 | tee runtime-output.txt

      - name: Upload runtime preparation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-preparation-log
          path: backend/runtime-output.txt
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint 2>&1 | tee typecheck-output.txt

      - name: Validate frontend security and accessibility contracts
        run: npm run test:bff && npm run test:mfa && npm run test:security && npm run test:accessibility

      - name: Upload frontend validation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-validation-log
          path: frontend/typecheck-output.txt
          if-no-files-found: ignore

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://defi-thesis-risk-copilot.onrender.com
          NEXT_PUBLIC_PUBLIC_DEMO_MODE: "false"
        run: npm run build

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e && npm run test:phase20h && npm run test:phase20i

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-browser-e2e-artifacts
          path: frontend/test-results/phase16-e2e
          if-no-files-found: ignore

      - name: Validate MFA route handlers
        run: npm run test:mfa:routes

  compose:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2
        with:
          persist-credentials: false

      - name: Validate compose config
        run: docker compose config

      - name: Validate production compose config
        run: docker compose -f docker-compose.production.yml config
