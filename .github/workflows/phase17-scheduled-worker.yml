name: Phase 17 Scheduled Worker

on:
  schedule:
    # Avoid the top of the hour, when scheduled GitHub workflows are more likely to be delayed.
    - cron: "7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase17-scheduled-worker
  cancel-in-progress: false

jobs:
  process-one-job:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production-worker
    defaults:
      run:
        working-directory: backend
    env:
      WORKER_CONTROL_PLANE_URL: ${{ secrets.WORKER_CONTROL_PLANE_URL }}
      WORKER_CREDENTIAL: ${{ secrets.WORKER_CREDENTIAL }}
      # This is a worker-only, least-privilege database role. It is not the
      # application database credential and is needed by the deterministic
      # analysis executor for owner/scope lookup and market-data caching.
      DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
      WORKER_PROTOCOL_VERSION: v1
      LLM_SYNTHESIS_ENABLED: "false"
      VAST_ENABLED: "false"
      VAST_DRY_RUN: "true"
      VAST_REAL_RENTALS_ENABLED: "false"
    steps:
      - name: Checkout default-branch worker code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install worker dependencies
        run: pip install -r requirements.txt

      - name: Claim and process one durable job
        run: python -m app.jobs.worker_runner --once
