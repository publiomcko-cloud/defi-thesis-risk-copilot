name: Phase 17 Scheduled Worker

on:
  schedule:
    # Avoid the top of the hour, when scheduled GitHub workflows are more likely to be delayed.
    - cron: "7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase17-scheduled-worker
  cancel-in-progress: false

jobs:
  process-one-job:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production-worker
    defaults:
      run:
        working-directory: backend
    env:
      WORKER_PROTOCOL_VERSION: v1
      LLM_SYNTHESIS_ENABLED: "false"
      VAST_ENABLED: "false"
      VAST_DRY_RUN: "true"
      VAST_REAL_RENTALS_ENABLED: "false"
    steps:
      - name: Checkout default-branch worker code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install worker dependencies
        run: pip install -r requirements.txt

      - name: Validate PostgreSQL TLS and process one durable job
        env:
          # Secrets are available only in this preflight-plus-worker step. The
          # bootstrap validates them, then replaces itself with the worker.
          WORKER_CONTROL_PLANE_URL: ${{ secrets.WORKER_CONTROL_PLANE_URL }}
          WORKER_CREDENTIAL: ${{ secrets.WORKER_CREDENTIAL }}
          # Worker-only least-privilege role for database-backed execution.
          DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
        run: python -m app.jobs.worker_tls
